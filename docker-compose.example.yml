services:
  home-proxy:
    image: gogost/gost:latest
    container_name: giz-home-proxy
    restart: unless-stopped
    command: >-
      -L "http://${HOME_PROXY_USER:-gizproxy}:${HOME_PROXY_PASS}@:8888?resolver=udp://1.1.1.1:53?only=ipv4,tcp://8.8.8.8:53?only=ipv4"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - "127.0.0.1:18888:8888"
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
