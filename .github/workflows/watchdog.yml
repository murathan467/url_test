name: 7/24 Watchdog (Otomatik Kurtarma)

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  actions: write

jobs:
  ensure-running:
    name: Bot Durum Kontrolu
    if: vars.BOT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: tracker.yml aktif mi kontrol et ve gerekirse baslat
        uses: actions/github-script@v9
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          retries: '3'
          script: |
            const activeStatuses = new Set(["in_progress", "queued", "waiting", "requested", "pending"]);
            const { data: runsData } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "tracker.yml",
              per_page: 15,
            });

            const activeRun = runsData.workflow_runs.find((r) => activeStatuses.has(r.status));
            if (activeRun) {
              console.log(
                `tracker.yml zaten aktif (run_id=${activeRun.id}, status=${activeRun.status}). Ek baslatma yapilmadi.`
              );
              return;
            }

            // --- Ardisik kisa/tam cokme korumasi ---
            // Not: OXXO/Mango 5.5 saat calisip tek bir magaza fail oldugunda workflow 'failure'
            // gorunse bile gercek bir sonsuz fail dongusu degildir. Ayrica tekil magaza manuel
            // test kosulari (stores != 'all' veya max_run_minutes != '') retrigger job'unu
            // 'skipped' biraktigi icin devre kesiciye sayilmamalidir; yalnizca tam 7/24
            // kosularinda <10 dk icinde ust uste 3 kez cokme oldugunda devre kesici tetiklenir.
            const completedRuns = runsData.workflow_runs
              .filter((r) => r.status === "completed")
              .slice(0, 10);

            const isShortFailure = (r) => {
              if (r.conclusion !== "failure") return false;
              const startMs = new Date(r.run_started_at || r.created_at).getTime();
              const endMs = new Date(r.updated_at || r.created_at).getTime();
              const durSec = Math.max(0, Math.round((endMs - startMs) / 1000));
              return durSec < 600;
            };

            const isFullChainRun = async (r) => {
              try {
                const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: r.id,
                  per_page: 20,
                });
                const retriggerJob = jobsData.jobs.find((j) =>
                  (j.name || "").includes("Sonraki 7/24 Turu")
                );
                // Tekil magaza / kisa test kosularinda retrigger job'u 'skipped' olur.
                if (retriggerJob && retriggerJob.conclusion === "skipped") {
                  return false;
                }
                return true;
              } catch (e) {
                console.log(`Job bilgisi alinamadi (run_id=${r.id}): ${e}`);
                return true;
              }
            };

            const recentFullRuns = [];
            for (const run of completedRuns) {
              if (recentFullRuns.length >= 3) break;
              if (isShortFailure(run)) {
                if (await isFullChainRun(run)) {
                  recentFullRuns.push(run);
                } else {
                  console.log(
                    `Tekil/kisa test kosusu devre kesici hesabindan haric tutuldu (run_id=${run.id}).`
                  );
                }
              } else {
                recentFullRuns.push(run);
              }
            }

            const allShortFailed = recentFullRuns.length >= 3 &&
              recentFullRuns.every(isShortFailure);

            if (allShortFailed) {
              console.log(
                "Son 3 tam 7/24 tracker.yml calismasi 10 dk altinda ust uste basarisiz. " +
                "Sonsuz fail dongusu onleniyor; yeni tetikleme ATLANDI."
              );

              // Telegram uyarisini yalnizca son fail tazeyse (son 35 dk icinde) gonder;
              // her 30 dk'lik cron turunda tekrar spam atilmasini onle.
              const lastFailMs = recentFullRuns[0]
                ? new Date(recentFullRuns[0].updated_at || recentFullRuns[0].created_at).getTime()
                : 0;
              const minsSinceLastFail = lastFailMs
                ? (Date.now() - lastFailMs) / 60000
                : 999;

              const token = process.env.TELEGRAM_TOKEN || "";
              const chatId = process.env.TELEGRAM_CHAT_ID || "";
              if (token && chatId && minsSinceLastFail <= 35) {
                const lastFailTime = recentFullRuns[0]
                  ? recentFullRuns[0].updated_at
                  : "?";
                const msg =
                  "⚠️ <b>GizIndirimBot Watchdog Uyarisi</b>\n\n" +
                  "Son 3 tracker.yml calismasi 10 dk altinda ust uste <b>basarisiz</b> oldu.\n" +
                  `Son fail: ${lastFailTime}\n\n` +
                  "Olasi nedenler:\n" +
                  "• Ev PC kapali/uykuda veya proxy erisilemez\n" +
                  "• Oturum cookie'leri suresi dolmus\n" +
                  "• WAF/Captcha engeli\n\n" +
                  "Bot otomatik yeniden baslatilmayacak. " +
                  "Sorunu giderdikten sonra tracker.yml'i manuel calistirin.";
                try {
                  await fetch(
                    `https://api.telegram.org/bot${token}/sendMessage`,
                    {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({
                        chat_id: chatId,
                        text: msg,
                        parse_mode: "HTML",
                      }),
                    }
                  );
                  console.log("Telegram uyari mesaji gonderildi.");
                } catch (e) {
                  console.log(`Telegram gonderim hatasi: ${e}`);
                }
              } else {
                console.log(
                  `Son fail ${Math.round(minsSinceLastFail)} dk onceydi; tekrarli Telegram uyarisi atlandi.`
                );
              }
              return;
            }

            console.log("Aktif tracker.yml kosusu bulunamadi; 7/24 kurtarma tetiklemesi gonderiliyor...");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "tracker.yml",
              ref: "main",
              inputs: {
                chain_depth: "1",
              },
            });
            console.log("tracker.yml basariyla tetiklendi.");
