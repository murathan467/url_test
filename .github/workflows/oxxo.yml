name: Oxxo Takip Botu

on:
  workflow_dispatch:
  schedule:
    - cron: '10 */6 * * *'

jobs:
  oxxo-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Xvfb ve Patchright kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          patchright install chromium
          patchright install-deps chromium

      - name: Oxxo oturumunu yukle
        env:
          STORE_STATE: ${{ secrets.OXXO_STORAGE_STATE }}
        run: |
          if [ -n "$STORE_STATE" ]; then
            echo "$STORE_STATE" | tr -d '\r\n' | base64 --decode > oxxo_storage_state.json
          fi

      - name: Oxxo botunu sanal ekranda calistir
        env:
          COMMON_EMAIL: ${{ secrets.COMMON_EMAIL }}
          COMMON_PASSWORD: ${{ secrets.COMMON_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_RUN_MINUTES: ${{ vars.MAX_RUN_MINUTES || '345' }}
          REFRESH_INTERVAL: ${{ vars.REFRESH_INTERVAL || '30' }}
          MAX_ALERTS_PER_WAVE: ${{ vars.MAX_ALERTS_PER_WAVE || '3' }}
          TARGET_SIZES: ${{ vars.TARGET_SIZES || 'S,XS,34,36' }}
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main_bot.py --store oxxo

      - name: Guncel Oxxo oturumunu Secret olarak kaydet
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -s oxxo_storage_state.json ]; then
            base64 -w 0 oxxo_storage_state.json | gh secret set OXXO_STORAGE_STATE --repo "${{ github.repository }}"
          else
            echo "GH_PAT tanimli degil veya oturum dosyasi bos; Secret guncelleme atlandi."
          fi
